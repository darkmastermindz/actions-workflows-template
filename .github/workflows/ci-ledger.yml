name: CI Ledger
# Dogfood: price this repo's own CI runs. On PRs this comments the per-job cost
# breakdown; on pushes it writes the job summary.
# Note: workflow_run workflows only run from the repository's default branch.
on:
  workflow_run:
    workflows: ["CI", "Action test"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./
        with:
          budget_usd: "0.50"
